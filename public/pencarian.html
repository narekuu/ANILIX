
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090711">
<title>Pencarian Anime — ANILIX</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#090711;--panel:#191622;--border:rgba(190,150,255,.13);--purple:#a875ff;--purple2:#7650ae;--muted:#9993aa;--white:#f8f5ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--white);font-family:Inter,Arial,sans-serif}
button,input{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:35px}
.header{height:65px;padding:0 18px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20;background:rgba(9,7,17,.95);backdrop-filter:blur(16px)}
.back{width:35px;height:40px;border:0;background:none;color:white;display:grid;place-items:center}
.back svg{width:23px;height:23px}
.header h1{font-size:19px;font-weight:800;flex:1}
.content{padding:18px}
.heading{margin:7px 8px 17px}
.heading h2{font-size:20px;font-weight:800;letter-spacing:-.5px}
.heading p{color:var(--muted);font-size:12px;margin-top:7px;line-height:1.6}
.search-row{display:flex;gap:9px;align-items:center;margin:2px 0 20px}
.search-input{height:49px;min-width:0;flex:1;border:1.5px solid #57466d;border-radius:25px;background:#17121f;color:#fff;padding:0 19px;font-size:14px;outline:none;appearance:none}
.search-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a875ff12}
.search-input::placeholder{color:#9b91aa}
.search-input::-webkit-search-cancel-button{display:none}
.search-button{height:49px;min-width:83px;border:0;border-radius:25px;background:#7650ae;color:white;font-weight:800;font-size:13px;transition:.2s}
.search-button:active{transform:scale(.97)}
.filter-row{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:1px 0 5px;margin-bottom:20px}
.filter-row::-webkit-scrollbar{display:none}
.filter{flex:none;padding:9px 16px;border:1px solid #57466d;border-radius:25px;background:#17121f;color:#b8aec6;font-size:11px;font-weight:800;transition:.2s}
.filter.active{background:#a875ff20;border-color:var(--purple);color:#dfcaff}
.result-info{display:none;align-items:center;justify-content:space-between;margin:5px 3px 15px}
.result-info.show{display:flex}
.result-info strong{font-size:13px}
.result-info span{color:var(--muted);font-size:11px}
.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 12px}
.anime-card{min-width:0;display:block;animation:cardIn .25s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.poster{width:100%;aspect-ratio:.69;position:relative;overflow:hidden;border-radius:15px;background:#211633;border:1px solid var(--border)}
.poster img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
.poster-placeholder{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#211633,#100d18);color:#8065a5}
.poster-placeholder .material-symbols-rounded{font-size:45px;opacity:.55}
.poster-overlay{position:absolute;inset:0;background:linear-gradient(0deg,#08060de8,transparent 65%);pointer-events:none}
.poster-type{position:absolute;top:8px;left:7px;z-index:2;padding:5px 8px;border-radius:7px;background:linear-gradient(120deg,#8b55d8,#b77aff);color:white;font-size:8px;font-weight:800}
.poster-score{position:absolute;right:7px;top:8px;z-index:2;font-size:10px;font-weight:800;color:#f1d8ff;text-shadow:0 2px 5px #000}
.poster-year{position:absolute;bottom:9px;left:9px;z-index:2;font-size:9px;font-weight:700;color:#fff}
.anime-title{font-size:11px;font-weight:800;line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.anime-meta{color:var(--muted);font-size:9px;margin-top:4px;line-height:1.5}
.empty{padding:65px 15px;text-align:center;color:#a098b0}
.empty-icon{width:75px;height:75px;margin:0 auto 17px;border-radius:24px;display:grid;place-items:center;background:#a875ff12;border:1px solid #a875ff20;color:#a875ff}
.empty-icon .material-symbols-rounded{font-size:36px}
.empty strong{display:block;color:#e7e1f0;font-size:14px}
.empty p{font-size:11px;line-height:1.7;margin-top:7px;max-width:280px;margin-left:auto;margin-right:auto}
.loading{padding:55px 15px;text-align:center;color:#b8a5d0}
.loading .material-symbols-rounded{font-size:34px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:600px){.content{padding:22px 25px}.result-grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:25px 15px}}
@media(max-width:390px){.content{padding-left:12px;padding-right:12px}.result-grid{gap:19px 10px}}
</style>
<link rel="stylesheet" href="../css/page-transition.css">
</head>
<body>
<main class="app">
<header class="header">
<button class="back" id="backButton" aria-label="Kembali">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
</button>
<h1>Pencarian</h1>
</header>

<div class="content">
<div class="heading">
<h2>Cari Anime</h2>
<p>Temukan anime, donghua, dan movie favoritmu.</p>
</div>

<form class="search-row" id="searchForm">
<input class="search-input" id="searchInput" type="search" autocomplete="off" placeholder="Cari judul anime...">
<button class="search-button" type="submit">Cari</button>
</form>

<div class="filter-row" id="filterRow">
<button class="filter active" data-type="all">Semua</button>
<button class="filter" data-type="anime">Anime</button>
<button class="filter" data-type="donghua">Donghua</button>
<button class="filter" data-type="movie">Movie</button>
</div>

<div class="result-info" id="resultInfo">
<strong id="resultTitle">Hasil pencarian</strong>
<span id="resultCount"></span>
</div>

<div class="result-grid" id="searchResults"></div>

<div class="empty" id="emptyState">
<div class="empty-icon"><span class="material-symbols-rounded">search</span></div>
<strong>Temukan Anime Favoritmu</strong>
<p>Masukkan judul anime pada kolom pencarian untuk mulai menemukan koleksi yang kamu cari.</p>
</div>
</div>
</main>

<script>
const $ = id => document.getElementById(id);

const SEARCH_STATE_KEY = "anilix_search_state";
const SEARCH_ORIGIN_KEY = "anilix_opened_from_search";

let selectedType = "all";
let currentResults = [];
let currentQuery = "";

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g,char=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[char]));
}

/* SIMPAN KONDISI PENCARIAN */
function saveSearchState(){
 const state = {
  query: $("searchInput").value,
  type: selectedType,
  results: currentResults,
  scrollY: window.scrollY,
  resultTitle: $("resultTitle").textContent,
  resultCount: $("resultCount").textContent,
  hasSearched: $("resultInfo").classList.contains("show"),
  emptyHTML: $("emptyState").innerHTML,
  emptyDisplay: $("emptyState").style.display
 };

 try{
  sessionStorage.setItem(SEARCH_STATE_KEY,JSON.stringify(state));
 }catch(error){
  console.warn("Gagal menyimpan pencarian:",error);
 }
}

/* PULIHKAN KONDISI PENCARIAN */
function restoreSearchState(){
 let state;

 try{
  state = JSON.parse(sessionStorage.getItem(SEARCH_STATE_KEY));
 }catch(error){
  state = null;
 }

 if(!state) return false;

 $("searchInput").value = state.query || "";
 selectedType = state.type || "all";
 currentQuery = state.query || "";
 currentResults = Array.isArray(state.results) ? state.results : [];

 document.querySelectorAll(".filter").forEach(button=>{
  button.classList.toggle("active",button.dataset.type === selectedType);
 });

 if(currentResults.length){
  renderResults(currentResults,false);
 }else{
  $("searchResults").innerHTML = "";

  if(state.hasSearched){
   $("resultInfo").classList.add("show");
   $("resultTitle").textContent = state.resultTitle || "Hasil pencarian";
   $("resultCount").textContent = state.resultCount || "";
  }else{
   $("resultInfo").classList.remove("show");
  }

  if(state.emptyHTML) $("emptyState").innerHTML = state.emptyHTML;
  $("emptyState").style.display = state.emptyDisplay || "block";
 }

 requestAnimationFrame(()=>{
  window.scrollTo(0,Number(state.scrollY) || 0);
 });

 return true;
}

/* TOMBOL KEMBALI */
$("backButton").addEventListener("click",()=>{
 saveSearchState();

 if(history.length > 1){
  history.back();
 }else{
  location.href = "/";
 }
});

/* FILTER */
document.querySelectorAll(".filter").forEach(button=>{
 button.addEventListener("click",()=>{
  document.querySelectorAll(".filter").forEach(item=>item.classList.remove("active"));
  button.classList.add("active");
  selectedType = button.dataset.type;
  saveSearchState();
 });
});

/* EMPTY STATE */
function showEmpty(title,description){
 $("searchResults").innerHTML = "";
 $("resultInfo").classList.remove("show");
 $("emptyState").style.display = "block";
 $("emptyState").innerHTML = `
  <div class="empty-icon"><span class="material-symbols-rounded">search</span></div>
  <strong>${escapeHTML(title)}</strong>
  <p>${escapeHTML(description)}</p>
 `;
 saveSearchState();
}

/* LOADING */
function showLoading(){
 $("resultInfo").classList.remove("show");
 $("emptyState").style.display = "none";
 $("searchResults").innerHTML = `
  <div class="loading" style="grid-column:1/-1">
   <span class="material-symbols-rounded">progress_activity</span>
   <p style="font-size:11px;margin-top:10px">Mencari anime...</p>
  </div>
 `;
}

/* RENDER HASIL */
function renderResults(results,save=true){
 currentResults = Array.isArray(results) ? results : [];

 if(!currentResults.length){
  showEmpty("Anime tidak ditemukan","Tidak ada judul yang cocok dengan pencarianmu.");
  return;
 }

 $("emptyState").style.display = "none";
 $("resultInfo").classList.add("show");
 $("resultTitle").textContent = "Hasil pencarian";
 $("resultCount").textContent = currentResults.length + " hasil";

 $("searchResults").innerHTML = currentResults.map((anime,index)=>{
  const title = escapeHTML(anime.title || "Tanpa Judul");
  const poster = escapeHTML(anime.poster || "");
  const type = escapeHTML(anime.type || "anime");
  const year = escapeHTML(anime.year || "");
  const score = anime.score ?? "";

  const params = new URLSearchParams({
   type: anime.type || "anime",
   title: anime.title || ""
  });

  if(anime.id) params.set("id",anime.id);

  return `
   <a class="anime-card" href="detail.html?${params.toString()}" data-anime-index="${index}" style="animation-delay:${Math.min(index,15)*25}ms">
    <div class="poster">
     <div class="poster-placeholder"><span class="material-symbols-rounded">movie</span></div>
     ${poster ? `<img src="${poster}" alt="${title}" loading="lazy" onerror="this.style.display='none'" onload="this.previousElementSibling.style.display='none'">` : ""}
     <div class="poster-overlay"></div>
     <span class="poster-type">${type.toUpperCase()}</span>
     ${score !== "" ? `<span class="poster-score">★ ${escapeHTML(score)}</span>` : ""}
     <span class="poster-year">${year}</span>
    </div>
    <div class="anime-title">${title}</div>
    <div class="anime-meta">${escapeHTML(anime.status || "")}</div>
   </a>
  `;
 }).join("");

 if(save) saveSearchState();
}

/* SIMPAN SEBELUM MASUK DETAIL */
$("searchResults").addEventListener("click",event=>{
 const card = event.target.closest(".anime-card");
 if(!card) return;

 saveSearchState();

 try{
  sessionStorage.setItem(SEARCH_ORIGIN_KEY,"1");
 }catch(error){
  console.warn(error);
 }
});

/* API ANILIX - HUBUNGKAN NANTI */
async function searchAnime(query,type){
 /*
  Integrasi API milikmu nanti:

  const response = await fetch(
   API_URL + "/search?q=" +
   encodeURIComponent(query) +
   "&type=" + encodeURIComponent(type)
  );

  if(!response.ok) throw new Error("Gagal mengambil data");

  const data = await response.json();
  return data.results;
 */
 throw new Error("API_ANILIX_NOT_CONNECTED");
}

/* SUBMIT PENCARIAN */
$("searchForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const query = $("searchInput").value.trim();

 if(!query){
  showEmpty("Masukkan judul anime","Ketik judul anime, donghua, atau movie yang ingin kamu cari.");
  $("searchInput").focus();
  return;
 }

 currentQuery = query;
 currentResults = [];
 saveSearchState();
 showLoading();

 try{
  const results = await searchAnime(query,selectedType);
  renderResults(results);
 }catch(error){
  if(error.message === "API_ANILIX_NOT_CONNECTED"){
   showEmpty("API belum terhubung","Tampilan pencarian sudah siap. Hasil anime akan muncul setelah API ANILIX milikmu selesai dibuat dan dihubungkan.");
  }else{
   showEmpty("Pencarian gagal","Terjadi kesalahan saat mengambil data. Silakan coba lagi.");
   console.error("ANILIX Search:",error);
  }
 }
});

/* SIMPAN POSISI SCROLL */
window.addEventListener("pagehide",saveSearchState);
window.addEventListener("scroll",()=>{
 if(currentResults.length || $("resultInfo").classList.contains("show")){
  saveSearchState();
 }
},{passive:true});

/* PULIHKAN PENCARIAN */
const restored = restoreSearchState();

if(!restored){
 const params = new URLSearchParams(location.search);
 const initialQuery = params.get("q");
 if(initialQuery) $("searchInput").value = initialQuery;
}
</script>

<script src="../js/page-transition.js" defer></script>
<script src="../js/skeleton-loading.js" defer></script>
<script src="../js/poster-loading.js" defer></script>
</body>
</html>


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090711">
<title>Teman — ANILIX</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
 --bg:#090711;
 --panel:#191622;
 --panel2:#211b2d;
 --border:rgba(190,150,255,.13);
 --purple:#a875ff;
 --purple2:#8652d8;
 --muted:#9993aa;
 --white:#f8f5ff;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 -webkit-tap-highlight-color:transparent;
}

body{
 min-height:100vh;
 background:var(--bg);
 color:var(--white);
 font-family:Inter,Arial,sans-serif;
}

button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}

.app{
 max-width:720px;
 margin:auto;
 min-height:100vh;
 padding-bottom:35px;
}

.header{
 height:65px;
 padding:0 18px;
 display:flex;
 align-items:center;
 gap:14px;
 position:sticky;
 top:0;
 z-index:20;
 background:rgba(9,7,17,.95);
 backdrop-filter:blur(16px);
}

.back,.header-search{
 border:0;
 background:none;
 color:white;
 display:grid;
 place-items:center;
 padding:5px;
}

.back svg{
 width:23px;
 height:23px;
}

.header h1{
 font-size:19px;
 font-weight:800;
 flex:1;
}

.header-search{
 width:40px;
 height:40px;
 border-radius:50%;
 color:#c6a0ff;
 transition:.2s;
}

.header-search:active{
 background:#a875ff20;
 transform:scale(.94);
}

.header-search svg{
 width:23px;
 height:23px;
}

.tabs{
 height:68px;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 padding:0 12px;
 border-bottom:1px solid #ffffff0c;
}

.tab{
 position:relative;
 background:none;
 border:0;
 color:#91899f;
 font-weight:800;
 font-size:14px;
}

.tab.active{color:#fff}

.tab.active:after{
 content:"";
 position:absolute;
 width:42px;
 height:4px;
 border-radius:8px;
 background:var(--purple);
 bottom:7px;
 left:50%;
 transform:translateX(-50%);
}

.content{padding:16px 18px 30px}

.panel{display:none}
.panel.active{display:block}

.section-label{
 font-size:13px;
 font-weight:800;
 color:#c5b5e8;
 margin:5px 8px 14px;
}

.friend-list{
 display:flex;
 flex-direction:column;
 gap:10px;
}

.friend-search-wrap{
 display:none;
 margin:0 0 15px;
 animation:searchIn .2s ease;
}

.friend-search-wrap.show{display:block}

@keyframes searchIn{
 from{opacity:0;transform:translateY(-5px)}
 to{opacity:1;transform:translateY(0)}
}

.friend-search-box{
 height:46px;
 display:flex;
 align-items:center;
 gap:10px;
 padding:0 15px;
 border:1.5px solid #57466d;
 border-radius:25px;
 background:#17121f;
}

.friend-search-box:focus-within{
 border-color:var(--purple);
}

.friend-search-box svg{
 width:19px;
 height:19px;
 flex:0 0 19px;
 color:#a98acb;
}

.friend-search-input{
 width:100%;
 min-width:0;
 border:0;
 outline:0;
 background:transparent;
 color:white;
 font-size:13px;
}

.friend-search-input::placeholder{color:#9b91aa}

.clear-friend-search{
 width:27px;
 height:27px;
 flex:0 0 27px;
 display:none;
 place-items:center;
 border:0;
 border-radius:50%;
 color:#c8b8dc;
 background:#ffffff12;
}

.clear-friend-search.show{display:grid}

.clear-friend-search svg{
 width:15px;
 height:15px;
}

/* USER CARD */
.user-card{
 min-height:88px;
 width:100%;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:17px;
 padding:12px 13px;
 display:flex;
 align-items:center;
 gap:11px;
 position:relative;
 user-select:none;
 -webkit-user-select:none;
}

.user-card[data-friend-card]{
 touch-action:pan-y;
}

.avatar-link{
 width:53px;
 height:53px;
 flex:0 0 53px;
 border-radius:50%;
 overflow:hidden;
 display:grid;
 place-items:center;
 background:#30243f;
 border:2px solid #57456e;
 color:white;
 font-size:19px;
 font-weight:800;
}

.avatar-link img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.user-main{
 min-width:0;
 flex:1 1 auto;
}

.name-line{
 display:flex;
 align-items:center;
 gap:5px;
 flex-wrap:wrap;
 margin-bottom:7px;
}

.user-name{
 font-size:14px;
 font-weight:800;
 overflow-wrap:anywhere;
}

.verified{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
 font-size:15px;
 line-height:1;
}

.verified .material-symbols-rounded{
 font-size:inherit;
 font-variation-settings:
 'FILL' 1,
 'wght' 500,
 'GRAD' 0,
 'opsz' 24;
}

.v-developer{color:#F5223E}
.v-admin{color:#20C878}
.v-moderator{color:#24A9E8}
.v-beta{color:#A855F7}
.v-premium{color:#E5AD35}

.meta-line{
 display:flex;
 align-items:center;
 gap:8px;
 flex-wrap:wrap;
}

.level{
 --c1:#526b86;
 --c2:#e9f7ff;
 --c3:#8aa8c8;
 --glow:#c5e8ff;

 display:inline-flex;
 align-items:center;
 gap:5px;
 padding:5px 9px;
 border-radius:30px;
 color:white;
 font-size:10px;
 font-weight:800;
 white-space:nowrap;
 background:linear-gradient(115deg,var(--c1),var(--c2),var(--c3),var(--c1));
 background-size:250% 100%;
 animation:flow 3s ease-in-out infinite;
 border:1px solid #ffffff30;
 box-shadow:0 0 8px color-mix(in srgb,var(--glow) 22%,transparent);
}

.level img{
 width:13px;
 height:13px;
 object-fit:contain;
 image-rendering:pixelated;
}

@keyframes flow{
 0%,100%{background-position:0 50%}
 50%{background-position:100% 50%}
}

.user-id{
 font-size:11px;
 color:#a39bb3;
 font-weight:700;
 white-space:nowrap;
}

.message-btn{
 width:39px;
 height:39px;
 flex:0 0 39px;
 margin-left:auto;
 align-self:center;
 border:0;
 border-radius:50%;
 background:transparent;
 color:#bd91ff;
 display:grid;
 place-items:center;
}

.message-btn svg{
 width:25px;
 height:25px;
 fill:#bd91ff;
 stroke:#191622;
 stroke-width:1.3;
}

.message-btn:active{
 background:#a875ff20;
 transform:scale(.94);
}

/* REQUEST */
.request-card{
 display:block;
 padding:14px;
}

.request-top{
 display:flex;
 align-items:center;
 gap:11px;
 width:100%;
}

.request-actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:15px;
}

.action{
 height:43px;
 border:0;
 border-radius:12px;
 font-size:13px;
 font-weight:800;
 color:white;
 background:var(--purple2);
}

.action.secondary{
 background:#393143;
 color:#e5dcef;
}

.action:active,.search-button:active{
 transform:scale(.98);
}

.pending-note{
 font-size:11px;
 color:#aaa0ba;
 font-weight:700;
 margin-top:7px;
}

.request-out .request-actions{
 grid-template-columns:1fr;
}

/* EMPTY */
.empty{
 padding:48px 12px;
 text-align:center;
 color:#a098b0;
}

.empty .material-symbols-rounded{
 font-size:40px;
 color:#8065a5;
}

.empty strong{
 display:block;
 color:#e7e1f0;
 font-size:14px;
 margin-top:10px;
}

.empty p{
 font-size:11px;
 line-height:1.6;
 margin-top:6px;
}

/* SEARCH TAB */
.search-row{
 display:flex;
 gap:9px;
 align-items:center;
 margin:2px 0 18px;
}

.search-input{
 height:49px;
 min-width:0;
 flex:1;
 border:1.5px solid #57466d;
 border-radius:25px;
 background:#17121f;
 color:#fff;
 padding:0 19px;
 font-size:14px;
 outline:none;
}

.search-input:focus{border-color:var(--purple)}
.search-input::placeholder{color:#9b91aa}

.search-button{
 height:49px;
 min-width:83px;
 border:0;
 border-radius:25px;
 background:#7650ae;
 color:white;
 font-weight:800;
 font-size:13px;
}

/* KONFIRMASI HAPUS TEMAN */
.confirm-overlay{
 position:fixed;
 inset:0;
 z-index:100;
 background:#000b;
 display:none;
 align-items:center;
 justify-content:center;
 padding:22px;
 backdrop-filter:blur(5px);
}

.confirm-overlay.show{display:flex}

.confirm-box{
 width:100%;
 max-width:340px;
 padding:23px;
 border-radius:20px;
 background:#191622;
 border:1px solid #a875ff35;
 text-align:center;
 animation:confirmIn .2s ease;
}

@keyframes confirmIn{
 from{opacity:0;transform:scale(.94)}
 to{opacity:1;transform:scale(1)}
}

.confirm-icon{
 width:55px;
 height:55px;
 border-radius:17px;
 display:grid;
 place-items:center;
 margin:0 auto 15px;
 background:#a875ff18;
 color:#bd91ff;
}

.confirm-icon .material-symbols-rounded{
 font-size:29px;
}

.confirm-box h3{
 font-size:17px;
 margin-bottom:8px;
}

.confirm-box p{
 font-size:12px;
 color:#aaa0ba;
 line-height:1.6;
 margin-bottom:20px;
}

.confirm-actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
}

.confirm-actions button{
 height:43px;
 border:0;
 border-radius:12px;
 font-size:13px;
 font-weight:800;
}

.cancel-delete{
 background:#393143;
 color:white;
}

.confirm-delete{
 background:#a43e69;
 color:white;
}

/* TOAST */
.toast{
 position:fixed;
 bottom:25px;
 left:50%;
 transform:translate(-50%,15px);
 background:#292238;
 border:1px solid #ffffff20;
 border-radius:12px;
 padding:12px 17px;
 font-size:12px;
 font-weight:700;
 opacity:0;
 visibility:hidden;
 transition:.2s;
 z-index:120;
 white-space:nowrap;
}

.toast.show{
 opacity:1;
 visibility:visible;
 transform:translate(-50%,0);
}

@media(max-width:390px){
 .content{padding-left:12px;padding-right:12px}
 .user-card{gap:9px;padding:11px}
 .avatar-link{width:49px;height:49px;flex-basis:49px}
 .user-name{font-size:13px}
 .level{font-size:9px;padding:5px 7px}
 .user-id{font-size:10px}
 .message-btn{width:35px;flex-basis:35px}
}
</style>
<link rel="stylesheet" href="../css/page-transition.css">
<link rel="stylesheet" href="../css/skeleton-loading.css">
</head>

<body>

<main class="app">

<header class="header">
 <button class="back" id="backButton" aria-label="Kembali">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
   <path d="m15 18-6-6 6-6"/>
  </svg>
 </button>

 <h1>Teman</h1>

 <button class="header-search" id="toggleFriendSearch" aria-label="Cari teman">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
   <circle cx="10.8" cy="10.8" r="6.8"/>
   <path d="m16 16 5 5"/>
  </svg>
 </button>
</header>

<nav class="tabs">
 <button class="tab active" data-tab="friends">Teman</button>
 <button class="tab" data-tab="requests">Permintaan</button>
 <button class="tab" data-tab="search">Cari Teman</button>
</nav>

<div class="content">

 <section class="panel active" id="friendsPanel">

  <div class="friend-search-wrap" id="friendSearchWrap">
   <div class="friend-search-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
     <circle cx="10.8" cy="10.8" r="6.8"/>
     <path d="m16 16 5 5"/>
    </svg>

    <input
     class="friend-search-input"
     id="friendSearchInput"
     type="search"
     autocomplete="off"
     placeholder="Cari nama atau User ID teman..."
    >

    <button class="clear-friend-search" id="clearFriendSearch" aria-label="Hapus pencarian">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="m18 6-12 12M6 6l12 12"/>
     </svg>
    </button>
   </div>
  </div>

  <div class="friend-list" id="friendsList"></div>
 </section>

 <section class="panel" id="requestsPanel">

  <div class="section-label">Permintaan Masuk</div>
  <div class="friend-list" id="incomingList"></div>

  <div class="section-label" style="margin-top:24px">Permintaan Terkirim</div>
  <div class="friend-list" id="outgoingList"></div>

 </section>

 <section class="panel" id="searchPanel">

  <form class="search-row" id="searchForm">
   <input
    class="search-input"
    id="searchId"
    type="search"
    autocomplete="off"
    placeholder="Cari nama atau User ID..."
   >
   <button class="search-button" type="submit">Cari</button>
  </form>

  <div class="friend-list" id="searchResults"></div>

 </section>

</div>
</main>

<!-- MODAL HAPUS TEMAN -->
<div class="confirm-overlay" id="removeFriendModal">
 <div class="confirm-box">

  <div class="confirm-icon">
   <span class="material-symbols-rounded">person_remove</span>
  </div>

  <h3>Hapus Pertemanan?</h3>

  <p>
   Apakah kamu yakin ingin menghapus
   <strong id="removeFriendName">teman ini</strong>
   dari daftar temanmu?
  </p>

  <div class="confirm-actions">
   <button class="cancel-delete" id="cancelRemoveFriend">Batal</button>
   <button class="confirm-delete" id="confirmRemoveFriend">Hapus</button>
  </div>

 </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);

function read(key,fallback=null){
 try{
  const value=localStorage.getItem(key);
  return value===null?fallback:JSON.parse(value);
 }catch{
  return fallback;
 }
}

function cleanId(id){
 return String(id??"").replace(/^#/,"").trim();
}

const current=read("anilix_user",{})||{};
const currentId=cleanId(current.id||current.userId||"guest");

function friendKey(from,to){
 return "anilix_friend_request_"+cleanId(from)+"_"+cleanId(to);
}

/* DATA PENGGUNA ASLI */
function getUser(id){
 id=cleanId(id);

 const list=read("anilix_users",[]);

 let user=Array.isArray(list)
  ?list.find(u=>cleanId(u.id||u.userId)===id)
  :null;

 if(!user){
  user=read("anilix_user_"+id,null);
 }

 if(!user&&id===currentId){
  user=current;
 }

 return user?{...user,id}:null;
}

/* SEMUA PENGGUNA TERDAFTAR */
function getAllUsers(){
 const users=[];
 const registered=read("anilix_users",[]);

 if(Array.isArray(registered)){
  registered.forEach(user=>{
   const id=cleanId(user.id||user.userId);
   if(!id)return;

   const index=users.findIndex(
    item=>cleanId(item.id)===id
   );

   if(index>=0){
    users[index]={...users[index],...user,id};
   }else{
    users.push({...user,id});
   }
  });
 }

 if(currentId!=="guest"&&currentId){
  const exists=users.some(
   user=>cleanId(user.id)===currentId
  );

  if(!exists){
   users.push({...current,id:currentId});
  }
 }

 return users;
}

/* LEVEL */
const rankList=[
 {file:"dirt",min:1,max:99,colors:["#8a5728","#d5a15c","#60401e"],glow:"#c18a4c"},
 {file:"oak_planks",min:100,max:499,colors:["#8a5728","#d5a15c","#60401e"],glow:"#c18a4c"},
 {file:"cobblestone",min:500,max:1499,colors:["#555a63","#a9adb5","#41454d"],glow:"#9a9da3"},
 {file:"coal",min:1500,max:4999,colors:["#333b49","#87909f","#202733"],glow:"#747b89"},
 {file:"copper_ingot",min:5000,max:9999,colors:["#914b2e","#e9a078","#62351f"],glow:"#d78352"},
 {file:"iron_ingot",min:10000,max:19999,colors:["#727e8c","#e0e5e9","#56616c"],glow:"#c2ccd5"},
 {file:"lapis_lazuli",min:20000,max:29999,colors:["#174a9b","#76b0ff","#12356e"],glow:"#4389ef"},
 {file:"redstone",min:30000,max:49999,colors:["#922525","#ff7777","#601717"],glow:"#ed4545"},
 {file:"gold_ingot",min:50000,max:69999,colors:["#956a14","#ffe17a","#684609"],glow:"#f2c64e"},
 {file:"quartz",min:70000,max:99999,colors:["#85847d","#fffdf0","#5d5c57"],glow:"#e8e7df"},
 {file:"emerald",min:100000,max:149999,colors:["#116c45","#75f0b1","#10472f"],glow:"#35d18a"},
 {file:"diamond",min:150000,max:199999,colors:["#167d91","#8af0ff","#104b66"],glow:"#62dcf5"},
 {file:"amethyst_shard",min:200000,max:249999,colors:["#63349a","#d6a4ff","#3c216d"],glow:"#bd83f5"},
 {file:"blaze_rod",min:250000,max:299999,colors:["#a64c16","#ffc078","#6c2d0c"],glow:"#ff9a42"},
 {file:"netherite_ingot",min:300000,max:399999,colors:["#554451","#b9a4b1","#332832"],glow:"#a58b9d"},
 {file:"lava_bucket",min:400000,max:499999,colors:["#a52c12","#ff9b48","#681b0c"],glow:"#ed6737"},
 {file:"nether_star",min:500000,max:Infinity,colors:["#526b86","#e9f7ff","#8aa8c8"],glow:"#c5e8ff"}
];

function levelMarkup(user){
 const n=Math.max(0,Math.floor(Number(user.level)||0));
 const rank=rankList.find(x=>n>=x.min&&n<=x.max);

 const style=rank
  ?`style="--c1:${rank.colors[0]};--c2:${rank.colors[1]};--c3:${rank.colors[2]};--glow:${rank.glow}"`
  :"";

 const icon=rank
  ?`<img src="https://project-crafting.github.io/minecraft-auto-updated-textures-api/items/${rank.file}.png" alt="">`
  :"";

 return `<span class="level" ${style}>${icon}<span>Lvl ${n.toLocaleString("id-ID")}</span></span>`;
}

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function avatarMarkup(user,id){
 const name=user.name||user.displayName||user.username||"U";
 const fallback=escapeHTML(name.trim().charAt(0).toUpperCase()||"U");
 const src=user.photoURL||user.photo||user.avatar||"";

 return `
 <a class="avatar-link"
  href="user-profile.html?id=${encodeURIComponent(id)}&from=teman.html"
  aria-label="Lihat profil">
  ${src?`<img src="${escapeHTML(src)}" alt="">`:fallback}
 </a>`;
}

function verifiedMarkup(user){
 const role=String(user.role||"member")
  .toLowerCase().trim().replace(/[\s_-]+/g,"");

 if(!user.verified||role==="member")return "";

 const colors={
  developer:"v-developer",
  dev:"v-developer",
  admin:"v-admin",
  administrator:"v-admin",
  moderator:"v-moderator",
  mod:"v-moderator",
  beta:"v-beta",
  betatester:"v-beta",
  premium:"v-premium"
 };

 return `<span class="verified ${colors[role]||""}">
  <span class="material-symbols-rounded">verified</span>
 </span>`;
}

/* KARTU PENGGUNA */
function userCard(user,id,mode="friend"){
 const name=user.name||user.displayName||user.username||"Pengguna";

 const profile=`
  <a class="user-name"
   href="user-profile.html?id=${encodeURIComponent(id)}&from=teman.html">
   ${escapeHTML(name)}
  </a>`;

 const info=`
  <div class="user-main">
   <div class="name-line">
    ${profile}
    ${verifiedMarkup(user)}
   </div>
   <div class="meta-line">
    ${levelMarkup(user)}
    <span class="user-id">#${escapeHTML(id)}</span>
   </div>
  </div>`;

 if(mode==="friend"){
  return `
  <article class="user-card" data-friend-card data-id="${escapeHTML(id)}">
   ${avatarMarkup(user,id)}
   ${info}

   <a class="message-btn"
    href="chat-teman.html?id=${encodeURIComponent(id)}"
    aria-label="Chat">
    <svg viewBox="0 0 24 24">
     <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v9a2.5 2.5 0 0 1-2.5 2.5H9l-5 4z"/>
     <path d="M8 8h8M8 12h8"/>
    </svg>
   </a>
  </article>`;
 }

 if(mode==="incoming"){
  return `
  <article class="user-card request-card">
   <div class="request-top">
    ${avatarMarkup(user,id)}
    ${info}
   </div>
   <div class="request-actions">
    <button class="action" data-action="accept" data-id="${escapeHTML(id)}">Terima</button>
    <button class="action secondary" data-action="reject" data-id="${escapeHTML(id)}">Tolak</button>
   </div>
  </article>`;
 }

 if(mode==="outgoing"){
  return `
  <article class="user-card request-card request-out">
   <div class="request-top">
    ${avatarMarkup(user,id)}
    <div class="user-main">
     <div class="name-line">${profile}${verifiedMarkup(user)}</div>
     <div class="meta-line">
      ${levelMarkup(user)}
      <span class="user-id">#${escapeHTML(id)}</span>
     </div>
     <div class="pending-note">Menunggu konfirmasi</div>
    </div>
   </div>
   <div class="request-actions">
    <button class="action secondary" data-action="cancel" data-id="${escapeHTML(id)}">Batal</button>
   </div>
  </article>`;
 }

 return `
 <article class="user-card">
  ${avatarMarkup(user,id)}
  ${info}
 </article>`;
}

/* RELASI PERTEMANAN */
function getAllFriendRelations(){
 const result={
  friends:[],
  incoming:[],
  outgoing:[]
 };

 for(let i=0;i<localStorage.length;i++){
  const key=localStorage.key(i)||"";

  if(!key.startsWith("anilix_friend_request_"))continue;

  const prefix="anilix_friend_request_";
  const parts=key.slice(prefix.length).split("_");

  if(parts.length<2)continue;

  const from=parts.shift();
  const to=parts.join("_");
  const status=read(key,null);

  if(status==="friends"&&(from===currentId||to===currentId)){
   const id=from===currentId?to:from;

   if(id!==currentId&&!result.friends.includes(id)){
    result.friends.push(id);
   }
  }

  if(status==="pending"&&to===currentId){
   if(!result.incoming.includes(from)){
    result.incoming.push(from);
   }
  }

  if(status==="pending"&&from===currentId){
   if(!result.outgoing.includes(to)){
    result.outgoing.push(to);
   }
  }
 }

 return result;
}

function empty(title,description){
 return `
 <div class="empty">
  <span class="material-symbols-rounded">group</span>
  <strong>${escapeHTML(title)}</strong>
  <p>${escapeHTML(description)}</p>
 </div>`;
}

/* RENDER TEMAN */
function renderFriends(){
 const relations=getAllFriendRelations();
 const query=$("friendSearchInput").value.trim().toLowerCase();

 let friendIds=relations.friends;

 if(query){
  friendIds=friendIds.filter(id=>{
   const user=getUser(id);
   if(!user)return false;

   const name=String(
    user.name||user.displayName||user.username||""
   ).toLowerCase();

   return name.includes(query)||String(id).toLowerCase().includes(query);
  });
 }

 $("friendsList").innerHTML=friendIds.length
  ?friendIds.map(id=>{
    const user=getUser(id);
    return user?userCard(user,id):"";
   }).join("")
  :query
   ?empty("Teman tidak ditemukan","Tidak ada teman dengan nama atau User ID tersebut.")
   :empty("Belum ada teman","Teman yang menerima permintaanmu akan muncul di sini.");
}

/* RENDER PERMINTAAN */
function renderRequests(){
 const relations=getAllFriendRelations();

 $("incomingList").innerHTML=relations.incoming.length
  ?relations.incoming.map(id=>{
    const user=getUser(id);
    return user?userCard(user,id,"incoming"):"";
   }).join("")
  :empty("Tidak ada permintaan masuk","Permintaan teman yang masuk akan muncul di sini.");

 $("outgoingList").innerHTML=relations.outgoing.length
  ?relations.outgoing.map(id=>{
    const user=getUser(id);
    return user?userCard(user,id,"outgoing"):"";
   }).join("")
  :empty("Tidak ada permintaan terkirim","Permintaan yang kamu kirim akan muncul di sini.");
}

function render(){
 renderFriends();
 renderRequests();
}

/* PENCARIAN HEADER */
let friendSearchOpen=false;

function toggleFriendSearch(force){
 friendSearchOpen=typeof force==="boolean"?force:!friendSearchOpen;

 $("friendSearchWrap").classList.toggle("show",friendSearchOpen);
 $("toggleFriendSearch").style.color=friendSearchOpen?"#fff":"#c6a0ff";

 if(friendSearchOpen){
  switchTab("friends");
  setTimeout(()=>$("friendSearchInput").focus(),80);
 }else{
  $("friendSearchInput").value="";
  $("clearFriendSearch").classList.remove("show");
  renderFriends();
 }
}

$("toggleFriendSearch").addEventListener("click",()=>{
 toggleFriendSearch();
});

$("friendSearchInput").addEventListener("input",()=>{
 const hasValue=$("friendSearchInput").value.length>0;
 $("clearFriendSearch").classList.toggle("show",hasValue);
 renderFriends();
});

$("clearFriendSearch").addEventListener("click",()=>{
 $("friendSearchInput").value="";
 $("clearFriendSearch").classList.remove("show");
 $("friendSearchInput").focus();
 renderFriends();
});

/* TAB */
function switchTab(name){
 document.querySelectorAll(".tab").forEach(button=>{
  button.classList.toggle("active",button.dataset.tab===name);
 });

 document.querySelectorAll(".panel").forEach(panel=>{
  panel.classList.toggle("active",panel.id===name+"Panel");
 });

 if(name==="friends")renderFriends();
 if(name==="requests")renderRequests();

 if(name==="search"){
  setTimeout(()=>$("searchId").focus(),80);
 }
}

document.querySelectorAll(".tab").forEach(button=>{
 button.addEventListener("click",()=>{
  switchTab(button.dataset.tab);
 });
});

/* TOAST */
let toastTimer;

function showToast(message){
 const toast=$("toast");
 toast.textContent=message;
 toast.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  toast.classList.remove("show");
 },2200);
}

/* BACK */
$("backButton").onclick=()=>{
 if(history.length>1)history.back();
 else location.href="/";
};

/* CARI PENGGUNA — gabungkan hasil database dengan cache lokal lama */
$("searchForm").addEventListener("submit",async event=>{
 event.preventDefault();

 const rawQuery=$("searchId").value.trim();
 const query=rawQuery.toLowerCase();

 if(!query){
  $("searchResults").innerHTML=empty(
   "Masukkan nama atau User ID",
   "Ketik nama pengguna atau ID untuk mencari teman."
  );
  return;
 }

 $("searchResults").innerHTML=empty("Mencari pengguna...","Mengambil daftar akun ANILIX.");

 try{
  const response=await fetch("/api/users/search?q="+encodeURIComponent(rawQuery),{
   credentials:"include",
   cache:"no-store",
   headers:{"Accept":"application/json"}
  });
  const payload=await response.json().catch(()=>({}));
  if(!response.ok){
   throw new Error(payload.message||"Pencarian akun gagal.");
  }

  const merged=new Map();
  (Array.isArray(payload.users)?payload.users:[]).forEach(user=>{
   const id=cleanId(user.id||user.userId);
   if(id&&id!==currentId)merged.set(id,{...user,id});
  });

  getAllUsers().forEach(user=>{
   const id=cleanId(user.id||user.userId);
   const name=String(user.name||user.displayName||user.username||"").toLowerCase();
   if(id&&id!==currentId&&(id.toLowerCase().includes(query)||name.includes(query))){
    merged.set(id,{...(merged.get(id)||{}),...user,id});
   }
  });

  const matches=[...merged.values()].filter(user=>{
   const id=cleanId(user.id);
   const name=String(user.name||user.displayName||user.username||"").toLowerCase();
   return id.toLowerCase().includes(query)||name.includes(query);
  });

  $("searchResults").innerHTML=matches.length
   ?matches.slice(0,30).map(user=>{
     const id=cleanId(user.id||user.userId);
     return userCard(user,id,"search");
    }).join("")
   :empty("Pengguna tidak ditemukan","Tidak ada akun yang cocok dengan nama atau User ID tersebut.");
 }catch(error){
  console.error("Pencarian pengguna gagal:",error);
  $("searchResults").innerHTML=empty("Pencarian gagal",error.message||"Periksa koneksi lalu coba lagi.");
 }
});

/* TERIMA / TOLAK / BATAL */
document.addEventListener("click",event=>{
 const button=event.target.closest("[data-action]");
 if(!button)return;

 const id=cleanId(button.dataset.id);
 const action=button.dataset.action;

 if(action==="accept"){
  localStorage.setItem(friendKey(id,currentId),JSON.stringify("friends"));
  localStorage.setItem(friendKey(currentId,id),JSON.stringify("friends"));
  showToast("Permintaan teman diterima");
 }

 if(action==="reject"){
  localStorage.removeItem(friendKey(id,currentId));
  showToast("Permintaan ditolak");
 }

 if(action==="cancel"){
  localStorage.removeItem(friendKey(currentId,id));
  showToast("Permintaan dibatalkan");
 }

 render();
});

/* LONG PRESS 700MS UNTUK HAPUS TEMAN */
let holdTimer=null;
let activeCard=null;
let selectedFriendId=null;
let suppressNextClick=false;

const HOLD_DURATION=700;

function clearHold(){
 clearTimeout(holdTimer);
 activeCard=null;
}

document.addEventListener("pointerdown",event=>{
 const card=event.target.closest("[data-friend-card]");
 if(!card)return;

 if(event.target.closest(".message-btn"))return;

 clearHold();
 activeCard=card;

 holdTimer=setTimeout(()=>{
  if(!activeCard)return;

  const id=activeCard.dataset.id;
  const user=getUser(id);

  suppressNextClick=true;
  clearHold();

  openRemoveFriend(
   id,
   user?.name||user?.displayName||"teman ini"
  );

  setTimeout(()=>{
   suppressNextClick=false;
  },800);
 },HOLD_DURATION);
});

document.addEventListener("pointerup",clearHold);
document.addEventListener("pointercancel",clearHold);
window.addEventListener("blur",clearHold);

document.addEventListener("click",event=>{
 if(!suppressNextClick)return;

 const card=event.target.closest("[data-friend-card]");
 if(!card)return;

 event.preventDefault();
 event.stopPropagation();
 suppressNextClick=false;
},true);

document.addEventListener("contextmenu",event=>{
 if(event.target.closest("[data-friend-card]")){
  event.preventDefault();
 }
});

/* KONFIRMASI HAPUS */
function openRemoveFriend(id,name){
 selectedFriendId=id;
 $("removeFriendName").textContent=name;
 $("removeFriendModal").classList.add("show");
}

function closeRemoveFriend(){
 $("removeFriendModal").classList.remove("show");
 selectedFriendId=null;
}

$("cancelRemoveFriend").onclick=closeRemoveFriend;

$("removeFriendModal").addEventListener("click",event=>{
 if(event.target===$("removeFriendModal")){
  closeRemoveFriend();
 }
});

/* HAPUS PERTEMANAN */
$("confirmRemoveFriend").onclick=()=>{
 if(!selectedFriendId)return;

 const id=selectedFriendId;

 localStorage.removeItem(friendKey(currentId,id));
 localStorage.removeItem(friendKey(id,currentId));

 closeRemoveFriend();
 render();

 showToast("Pertemanan berhasil dihapus");
};

/* SINKRONISASI */
window.addEventListener("storage",render);
window.addEventListener("pageshow",render);

/* MULAI */
if(currentId==="guest"){
 $("friendsList").innerHTML=empty(
  "Login diperlukan",
  "Silakan login terlebih dahulu untuk menggunakan fitur teman."
 );
 $("incomingList").innerHTML=empty(
  "Login diperlukan",
  "Silakan login untuk melihat permintaan teman."
 );
 $("outgoingList").innerHTML=empty(
  "Login diperlukan",
  "Silakan login untuk melihat permintaan terkirim."
 );
}else{
 render();
}
</script>

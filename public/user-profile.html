<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#090711">
<title>User Profile — ANILIX</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,1,0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root{
 --bg:#090711;
 --purple:#a875ff;
 --purple2:#7543d6;
 --light:#d4baff;
 --muted:#93899f;
 --white:#f8f5ff;
 --border:rgba(190,150,255,.13);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 min-height:100vh;
 background:radial-gradient(ellipse at 50% -15%,#30204d 0%,transparent 45%),var(--bg);
 color:var(--white);
 font-family:Inter,Arial,sans-serif;
}

button{font:inherit}
svg{
 width:19px;height:19px;
 stroke:currentColor;fill:none;
 stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
}

.app{
 max-width:700px;
 margin:auto;
 padding-bottom:35px;
}

/* PROFILE */

.profile-top{
 position:relative;
 background:linear-gradient(180deg,#17131f,#0d0b12);
 padding-bottom:19px;
}

.banner{
 height:165px;
 width:100%;
 position:relative;
 overflow:hidden;
 background:
 linear-gradient(135deg,rgba(117,67,214,.42),rgba(9,7,17,.35)),
 radial-gradient(ellipse at 25% 20%,#68428e,transparent 55%),
 linear-gradient(120deg,#30213f,#17111f 60%,#342044);
 background-size:cover;
 background-position:center;
}

.banner:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(180deg,transparent,rgba(9,7,17,.5));
}

/* BACK BUTTON */

.back-button{
 position:absolute;
 z-index:5;
 top:13px;
 left:15px;
 width:40px;
 height:40px;
 display:grid;
 place-items:center;
 border-radius:13px;
 color:#fff;
 background:rgba(20,13,32,.65);
 border:1px solid rgba(220,190,255,.25);
 backdrop-filter:blur(15px);
 -webkit-backdrop-filter:blur(15px);
 cursor:pointer;
 transition:.2s;
}

.back-button svg{
 width:22px;
 height:22px;
 stroke-width:2;
}

.back-button:active{transform:scale(.91)}

/* AVATAR */

.avatar-wrap{
 position:relative;
 z-index:2;
 width:105px;
 height:105px;
 margin:-73px auto 0;
}

.avatar{
 width:105px;
 height:105px;
 display:grid;
 place-items:center;
 overflow:hidden;
 border-radius:50%;
 background:linear-gradient(145deg,#9b68e9,#211433);
 border:4px solid #0d0b12;
 box-shadow:0 4px 18px #0008;
 color:white;
 font-size:34px;
 font-weight:800;
}

.avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
 border-radius:50%;
}

/* PROFILE INFO */

.profile-info{
 text-align:center;
 padding:11px 15px 0;
}

.username-line{
 display:flex;
 align-items:center;
 justify-content:center;
 flex-wrap:wrap;
 gap:7px;
}

.username{
 font-size:21px;
 line-height:1.35;
 font-weight:800;
 overflow-wrap:anywhere;
}

.user-id{
 color:#958b9d;
 font-size:12px;
 font-weight:500;
}

/* VERIFIED */

.verified{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 flex-shrink:0;
 font-size:19px;
 line-height:1;
}

.verified .material-symbols-rounded{
 font-size:inherit;
 font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24;
}

.v-developer{color:#F5223E}
.v-admin{color:#20C878}
.v-moderator{color:#24A9E8}
.v-beta{color:#A855F7}
.v-premium{color:#E5AD35}

/* BADGES */

.member-badges{
 display:flex;
 justify-content:center;
 align-items:center;
 flex-wrap:wrap;
 gap:8px;
 margin-top:14px;
}

/* LEVEL */

.level{
 --c1:#526b86;
 --c2:#e9f7ff;
 --c3:#8aa8c8;
 --glow:#c5e8ff;

 display:inline-flex;
 align-items:center;
 gap:6px;
 padding:5px 10px;
 border-radius:30px;
 color:white;
 font-size:10px;
 font-weight:800;
 line-height:1.2;
 white-space:nowrap;
 background:linear-gradient(115deg,var(--c1),var(--c2),var(--c3),var(--c1));
 background-size:250% 100%;
 animation:levelGradient 3s ease-in-out infinite;
 border:1px solid #ffffff45;
 box-shadow:0 0 12px color-mix(in srgb,var(--glow) 30%,transparent);
 cursor:default;
}

.level img{
 width:13px;
 height:13px;
 object-fit:contain;
 image-rendering:pixelated;
 transform:scale(1.30);
}

@keyframes levelGradient{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

/* ROLE */

.profile-role{
 position:relative;
 display:inline-flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 padding:5px 10px;
 border-radius:999px;
 color:#fff;
 font-size:10px;
 font-weight:800;
 letter-spacing:.3px;
 line-height:1.2;
 border:1px solid rgba(255,255,255,.17);
 background-size:250% 250%;
 animation:badgeColorFlow 5s ease-in-out infinite;
 isolation:isolate;
 white-space:nowrap;
}

.profile-role::after{
 content:"";
 position:absolute;
 top:-50%;
 left:-80%;
 width:45%;
 height:200%;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.38),transparent);
 transform:rotate(25deg);
 animation:badgeShine 3s ease-in-out infinite;
 pointer-events:none;
 z-index:-1;
}

@keyframes badgeColorFlow{
 0%{background-position:0% 50%}
 50%{background-position:100% 50%}
 100%{background-position:0% 50%}
}

@keyframes badgeShine{
 0%{left:-80%}
 55%,100%{left:140%}
}

.role-developer{background-image:linear-gradient(120deg,#F5223E,#D92C43,#A91D35,#E83B50,#F5223E)}
.role-admin{background-image:linear-gradient(120deg,#20C878,#16A866,#087D4B,#28D18A,#20C878)}
.role-moderator{background-image:linear-gradient(120deg,#24A9E8,#168BCB,#12659E,#36B8F0,#24A9E8)}
.role-beta{background-image:linear-gradient(120deg,#A855F7,#9140D8,#682BA6,#B56BFF,#A855F7)}
.role-premium{background-image:linear-gradient(120deg,#E5AD35,#D49A26,#A9781D,#F0C354,#E5AD35);color:#30200A}
.role-member{background:#343440;color:#D0D0DC;animation:none}

/* ADD FRIEND */

.friend-action{
 display:flex;
 justify-content:center;
 padding:16px 15px 0;
}

.add-friend-button{
 width:100%;
 max-width:260px;
 height:42px;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:8px;
 border:1px solid rgba(190,150,255,.35);
 border-radius:13px;
 background:linear-gradient(120deg,#7543d6,#a875ff);
 color:#fff;
 font-size:12px;
 font-weight:800;
 cursor:pointer;
 box-shadow:0 4px 15px rgba(117,67,214,.2);
 transition:.2s;
}

.add-friend-button svg{
 width:18px;
 height:18px;
 stroke-width:2.2;
}

.add-friend-button:active{transform:scale(.96)}

.add-friend-button.pending{
 background:rgba(168,117,255,.12);
 color:#d4baff;
 border-color:rgba(190,150,255,.3);
 box-shadow:none;
}

.add-friend-button.friends{
 background:rgba(32,200,120,.12);
 color:#62e3a4;
 border-color:rgba(32,200,120,.3);
 box-shadow:none;
}

.add-friend-button:disabled{
 opacity:.7;
 cursor:default;
}

/* STATS */

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:4px;
 margin-top:20px;
 padding:0 12px;
}

.stat{text-align:center;min-width:0}

.stat strong{
 display:block;
 font-size:20px;
 font-weight:800;
 line-height:1.4;
 overflow:hidden;
 text-overflow:ellipsis;
}

.stat span{
 display:block;
 margin-top:2px;
 color:#aaa0b8;
 font-size:11px;
 font-weight:600;
}

/* TABS */

.tabs-section{margin-top:20px}

.tabs{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 align-items:center;
 border-bottom:1px solid rgba(190,150,255,.12);
 padding:0 13px;
}

.tab{
 position:relative;
 height:52px;
 display:flex;
 justify-content:center;
 align-items:center;
 background:none;
 border:0;
 color:#9990a9;
 font-size:13px;
 font-weight:800;
 cursor:pointer;
 transition:.2s;
}

.tab.active{color:#fff}

.tab.active:after{
 content:"";
 position:absolute;
 bottom:0;
 left:25%;
 width:50%;
 height:3px;
 border-radius:10px;
 background:#a875ff;
 box-shadow:0 0 10px #a875ff65;
}

/* ACTIVITY */

.tab-content{padding:14px 15px}

.activity-item{
 padding:13px 0 16px;
 border-bottom:1px solid rgba(190,150,255,.13);
}

.activity-user{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 padding-bottom:10px;
}

.activity-user-left{
 display:flex;
 align-items:center;
 gap:9px;
 min-width:0;
}

.small-avatar{
 width:39px;
 height:39px;
 flex-shrink:0;
 overflow:hidden;
 display:grid;
 place-items:center;
 border-radius:50%;
 background:linear-gradient(145deg,#9b68e9,#211433);
 border:1px solid rgba(190,150,255,.35);
 font-size:14px;
 font-weight:800;
}

.small-avatar img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.activity-name{
 display:flex;
 align-items:center;
 flex-wrap:wrap;
 gap:5px;
 font-size:12px;
 font-weight:800;
 overflow-wrap:anywhere;
}

.activity-name .user-id{
 font-size:10px;
 color:#93899f;
 font-weight:500;
}

.comment-verified{
 font-size:13px;
 width:14px;
 height:14px;
}

.activity-time{
 flex-shrink:0;
 color:#93899f;
 font-size:9px;
}

.activity-media{
 display:flex;
 align-items:center;
 gap:11px;
 margin-top:3px;
}

.anime-poster{
 width:72px;
 height:87px;
 flex-shrink:0;
 overflow:hidden;
 border-radius:10px;
 background:#211a2c;
}

.anime-poster img{
 width:100%;
 height:100%;
 object-fit:cover;
}

.media-info{min-width:0}
.media-title{font-size:12px;line-height:1.5;font-weight:600;color:#e8e1f0}
.media-subtitle{margin-top:4px;font-size:10px;color:#a79bb7}

.activity-description{
 margin-top:11px;
 font-size:12px;
 line-height:1.6;
 color:#eee8f5;
}

/* EMPTY */

.empty-state{
 padding:40px 15px;
 text-align:center;
}

.empty-icon{
 width:44px;
 height:44px;
 display:grid;
 place-items:center;
 margin:0 auto 12px;
 border-radius:15px;
 background:rgba(168,117,255,.10);
 color:#b995f2;
}

.empty-icon svg{width:22px;height:22px}
.empty-state strong{display:block;font-size:12px}
.empty-state p{
 margin-top:7px;
 color:var(--muted);
 font-size:10px;
 line-height:1.6;
}

/* TOAST */

.toast{
 position:fixed;
 z-index:300;
 left:50%;
 bottom:25px;
 transform:translate(-50%,20px);
 padding:11px 17px;
 border-radius:12px;
 background:#211a30;
 border:1px solid rgba(190,150,255,.25);
 color:#fff;
 font-size:11px;
 font-weight:600;
 opacity:0;
 visibility:hidden;
 transition:.25s;
 box-shadow:0 8px 25px #0007;
 white-space:nowrap;
}

.toast.show{
 opacity:1;
 visibility:visible;
 transform:translate(-50%,0);
}

@media(min-width:600px){
 .banner{height:200px}
 .avatar-wrap{width:115px;height:115px;margin-top:-80px}
 .avatar{width:115px;height:115px}
 .username{font-size:23px}
 .stats{max-width:550px;margin:22px auto 0}
 .friend-action{max-width:550px;margin:auto}
 .tab-content{max-width:650px;margin:auto}
}

@media(max-width:360px){
 .username{font-size:18px}
 .stat strong{font-size:18px}
 .stat span{font-size:10px}
 .activity-time{font-size:8px}
}

@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{
  animation-duration:.01ms!important;
  transition-duration:.01ms!important;
 }
}
</style>

<script>

/* USER PROFILE CONFIG */

const params = new URLSearchParams(location.search);

const TARGET_ID = String(params.get("id") || "1").replace(/^#/,"");

const PROFILE_CONFIG = {
 name:"Pengguna ANILIX",
 id:TARGET_ID,
 level:1,
 role:"member",
 verified:true,
 xp:0,
 requiredXP:2000,
 months:1,
 totalMinutes:0
};

/* MINECRAFT LEVEL */

const LEVEL_IMAGE_BASE =
 "https://project-crafting.github.io/minecraft-auto-updated-textures-api/items/";

const minecraftRanks = [
 {file:"dirt",min:1,max:99,colors:["#8a5728","#d5a15c","#60401e"],glow:"#c18a4c"},
 {file:"oak_planks",min:100,max:499,colors:["#8a5728","#d5a15c","#60401e"],glow:"#c18a4c"},
 {file:"cobblestone",min:500,max:1499,colors:["#555a63","#a9adb5","#41454d"],glow:"#9a9da3"},
 {file:"coal",min:1500,max:4999,colors:["#333b49","#87909f","#202733"],glow:"#747b89"},
 {file:"copper_ingot",min:5000,max:9999,colors:["#914b2e","#e9a078","#62351f"],glow:"#d78352"},
 {file:"iron_ingot",min:10000,max:19999,colors:["#727e8c","#e0e5e9","#56616c"],glow:"#c2ccd5"},
 {file:"lapis_lazuli",min:20000,max:29999,colors:["#174a9b","#76b0ff","#12356e"],glow:"#4389ef"},
 {file:"redstone",min:30000,max:49999,colors:["#922525","#ff7777","#601717"],glow:"#ed4545"},
 {file:"gold_ingot",min:50000,max:69999,colors:["#956a14","#ffe17a","#684609"],glow:"#f2c64e"},
 {file:"quartz",min:70000,max:99999,colors:["#85847d","#fffdf0","#5d5c57"],glow:"#e8e7df"},
 {file:"emerald",min:100000,max:149999,colors:["#116c45","#75f0b1","#10472f"],glow:"#35d18a"},
 {file:"diamond",min:150000,max:199999,colors:["#167d91","#8af0ff","#104b66"],glow:"#62dcf5"},
 {file:"amethyst_shard",min:200000,max:249999,colors:["#63349a","#d6a4ff","#3c216d"],glow:"#bd83f5"},
 {file:"blaze_rod",min:250000,max:299999,colors:["#a64c16","#ffc078","#6c2d0c"],glow:"#ff9a42"},
 {file:"netherite_ingot",min:300000,max:399999,colors:["#554451","#b9a4b1","#332832"],glow:"#a58b9d"},
 {file:"lava_bucket",min:400000,max:499999,colors:["#a52c12","#ff9b48","#6c180d"],glow:"#ff5a28"},
 {file:"nether_star",min:500000,max:Infinity,colors:["#526b86","#e9f7ff","#8aa8c8"],glow:"#c5e8ff"}
];

/* STORAGE */

function readStorage(key,fallback=null){

 try{
  const stored=localStorage.getItem(key);
  return stored===null?fallback:JSON.parse(stored);
 }catch(error){
  return fallback;
 }

}

/* CURRENT USER */

function getCurrentUser(){

 return (
  readStorage("anilix_user",null) ||
  readStorage("anilix_current_user",null) ||
  {}
 );

}

const CURRENT_USER = getCurrentUser();

const CURRENT_USER_ID = String(
 CURRENT_USER.id ||
 CURRENT_USER.userId ||
 "guest"
);

/* TARGET USER DATA */

function getTargetUser(){

 const users=readStorage("anilix_users",[]);

 let user=null;

 if(Array.isArray(users)){
  user=users.find(item=>String(item.id).replace(/^#/,"")===TARGET_ID);
 }

 if(!user){
  user=readStorage("anilix_user_"+TARGET_ID,null);
 }

 if(!user){
  user={...PROFILE_CONFIG};
 }

 return {
  ...PROFILE_CONFIG,
  ...user,
  id:TARGET_ID
 };

}

/* INDEXED DB */

const MEDIA_DB_NAME="ANILIX_STORAGE";
const MEDIA_STORE_NAME="images";

function openMediaDB(){

 return new Promise((resolve,reject)=>{

  const request=indexedDB.open(MEDIA_DB_NAME,1);

  request.onupgradeneeded=()=>{
   const db=request.result;

   if(!db.objectStoreNames.contains(MEDIA_STORE_NAME)){
    db.createObjectStore(MEDIA_STORE_NAME);
   }
  };

  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);

 });

}

async function getMedia(key){

 const db=await openMediaDB();

 return new Promise((resolve,reject)=>{

  const transaction=db.transaction(MEDIA_STORE_NAME,"readonly");
  const request=transaction.objectStore(MEDIA_STORE_NAME).get(key);

  request.onsuccess=()=>{
   const result=request.result||null;
   db.close();
   resolve(result);
  };

  request.onerror=()=>{
   db.close();
   reject(request.error);
  };

 });

}

/* IMAGE */

let avatarURL="";
let bannerURL="";

function setAvatarImage(source){

 const element=document.getElementById("avatar");

 if(avatarURL){
  URL.revokeObjectURL(avatarURL);
  avatarURL="";
 }

 if(!source){
  element.textContent=(getTargetUser().name||"U").charAt(0).toUpperCase();
  return;
 }

 let imageURL=source;

 if(source instanceof Blob){
  imageURL=URL.createObjectURL(source);
  avatarURL=imageURL;
 }

 const img=document.createElement("img");
 img.src=imageURL;
 img.alt="Foto profil";

 img.onerror=()=>{
  element.textContent=(getTargetUser().name||"U").charAt(0).toUpperCase();
 };

 element.replaceChildren(img);

}

function setBannerImage(source){

 const banner=document.getElementById("profileBanner");

 if(bannerURL){
  URL.revokeObjectURL(bannerURL);
  bannerURL="";
 }

 if(!source){
  banner.style.backgroundImage="";
  return;
 }

 let imageURL=source;

 if(source instanceof Blob){
  imageURL=URL.createObjectURL(source);
  bannerURL=imageURL;
 }

 banner.style.backgroundImage=
  `linear-gradient(180deg,rgba(0,0,0,.05),rgba(9,7,17,.45)),url("${imageURL}")`;

}

/* LEVEL */

function updateMinecraftLevel(level){

 const userLevel=Math.max(0,Math.floor(Number(level)||0));

 const rank=minecraftRanks.find(item=>
  userLevel>=item.min && userLevel<=item.max
 );

 const badge=document.getElementById("levelBadge");
 const icon=document.getElementById("levelIcon");

 document.getElementById("levelText").textContent=
  "Lv "+userLevel.toLocaleString("id-ID");

 if(rank){

  badge.style.setProperty("--c1",rank.colors[0]);
  badge.style.setProperty("--c2",rank.colors[1]);
  badge.style.setProperty("--c3",rank.colors[2]);
  badge.style.setProperty("--glow",rank.glow);

  icon.src=LEVEL_IMAGE_BASE+rank.file+".png";
  icon.style.display="block";

 }else{
  icon.style.display="none";
 }

}

/* ROLE + VERIFIED */

const roleSettings={
 developer:{name:"Developer",badge:"role-developer",verified:"v-developer"},
 admin:{name:"Admin",badge:"role-admin",verified:"v-admin"},
 moderator:{name:"Moderator",badge:"role-moderator",verified:"v-moderator"},
 beta:{name:"Beta Tester",badge:"role-beta",verified:"v-beta"},
 premium:{name:"Premium",badge:"role-premium",verified:"v-premium"},
 member:{name:"Member",badge:"role-member",verified:""}
};

function getRoleKey(role){

 const normalized=String(role||"member")
  .toLowerCase()
  .trim()
  .replace(/[\s_-]+/g,"");

 const aliases={
  developer:"developer",
  dev:"developer",
  admin:"admin",
  administrator:"admin",
  moderator:"moderator",
  mod:"moderator",
  beta:"beta",
  betatester:"beta",
  premium:"premium",
  member:"member",
  user:"member"
 };

 return aliases[normalized]||"member";

}

function updateRole(role){

 const badge=document.getElementById("roleBadge");
 const verified=document.getElementById("verifiedBadge");

 const roleKey=getRoleKey(role);
 const selected=roleSettings[roleKey];

 badge.textContent=selected.name;
 badge.className="profile-role "+selected.badge;

 verified.className="verified "+selected.verified;

 return roleKey;

}

/* TARGET MEDIA */

async function loadTargetMedia(user){

 try{

  const [avatar,banner]=await Promise.all([
   getMedia("avatar_"+TARGET_ID),
   getMedia("banner_"+TARGET_ID)
  ]);

  if(avatar){
   setAvatarImage(avatar);
  }else{
   setAvatarImage(
    user.photoURL||user.photo||user.avatar||null
   );
  }

  if(banner){
   setBannerImage(banner);
  }else{
   setBannerImage(user.banner||null);
  }

 }catch(error){

  console.warn("Media profil tidak dapat dimuat:",error);

  setAvatarImage(user.photoURL||user.photo||user.avatar||null);
  setBannerImage(user.banner||null);

 }

}

/* ACTIVITY DATA */

const demoData = { comments:[], favorites:[], history:[] };

function getTabData(tab){

 const user=getTargetUser();
 const userId=TARGET_ID;

 const keys={
  comments:"anilix_comments_"+userId,
  favorites:"anilix_favorites_"+userId,
  history:"anilix_history_"+userId
 };

 const stored=readStorage(keys[tab],null);

 if(Array.isArray(stored)){
  return stored;
 }

 if(user[tab] && Array.isArray(user[tab])){
  return user[tab];
 }

 return [];

}

/* ESCAPE HTML */

function escapeHTML(value){

 return String(value??"").replace(/[&<>"']/g,char=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[char]));

}

/* EMPTY STATE */

function renderEmpty(message){

 return `
  <div class="empty-state">
   <div class="empty-icon">
    <svg viewBox="0 0 24 24">
     <path d="M4 5h16v14H4z"/>
     <path d="M8 10h8M8 14h5"/>
    </svg>
   </div>
   <strong>${message}</strong>
   <p>Aktivitas pengguna ini akan muncul di sini.</p>
  </div>
 `;

}

/* RENDER TAB */

let currentTab="comments";

function renderTab(){

 const container=document.getElementById("tabContent");
 const items=getTabData(currentTab);
 const user=getTargetUser();

 if(!items.length){

  const messages={
   comments:"Belum ada komentar",
   favorites:"Belum ada anime favorit",
   history:"Belum ada riwayat tontonan"
  };

  container.innerHTML=renderEmpty(messages[currentTab]);
  return;

 }

 const profileName=user.name||"Pengguna";
 const roleKey=getRoleKey(user.role);

 const verified=user.verified && roleKey!=="member";
 const verifiedClass=verified?roleSettings[roleKey].verified:"";

 container.innerHTML=items.slice(0,30).map(item=>{

  const title=escapeHTML(item.title||item.animeTitle||"Anime");
  const image=escapeHTML(item.image||item.poster||item.cover||"");

  const episode=item.episode
   ?(
    String(item.episode).toLowerCase().includes("episode")
     ?escapeHTML(item.episode)
     :"Episode "+escapeHTML(item.episode)
   )
   :"";

  let subtitle="";

  if(currentTab==="comments") subtitle=episode||"Komentar Anime";
  else if(currentTab==="favorites") subtitle="Anime Favorit";
  else subtitle=episode||"Riwayat Tontonan";

  const time=escapeHTML(item.time||item.date||item.updatedAt||"");
  const description=escapeHTML(item.description||item.comment||"");

  return `
   <article class="activity-item">

    <div class="activity-user">

     <div class="activity-user-left">

      <div class="small-avatar">
       ${escapeHTML(profileName.charAt(0).toUpperCase())}
      </div>

      <div class="activity-name">

       ${escapeHTML(profileName)}

       <span class="user-id">#${escapeHTML(TARGET_ID)}</span>

       ${
        verified
        ? `<span class="verified ${verifiedClass} comment-verified">
            <span class="material-symbols-rounded">verified</span>
           </span>`
        : ""
       }

      </div>

     </div>

     <span class="activity-time">${time}</span>

    </div>

    <div class="activity-media">

     <div class="anime-poster">
      ${image?`<img src="${image}" alt="${title}" loading="lazy">`:""}
     </div>

     <div class="media-info">
      <div class="media-title">${title}</div>
      <div class="media-subtitle">${subtitle}</div>
     </div>

    </div>

    ${description?`<div class="activity-description">${description}</div>`:""}

   </article>
  `;

 }).join("");

}

/* TAB CLICK */

document.querySelectorAll(".tab").forEach(button=>{

 button.addEventListener("click",()=>{

  document.querySelectorAll(".tab").forEach(tab=>
   tab.classList.remove("active")
  );

  button.classList.add("active");
  currentTab=button.dataset.tab;

  renderTab();

 });

});

/* TOAST */

let toastTimer;

function showToast(message){

 const toast=document.getElementById("toast");

 toast.textContent=message;
 toast.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  toast.classList.remove("show");
 },2200);

}

/* FRIEND BUTTON */

const friendButton=document.getElementById("addFriendButton");

const friendKey=
 "anilix_friend_request_"+CURRENT_USER_ID+"_"+TARGET_ID;

const reverseFriendKey=
 "anilix_friend_request_"+TARGET_ID+"_"+CURRENT_USER_ID;

function updateFriendButton(status){

 const addIcon=`
  <svg viewBox="0 0 24 24">
   <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
   <circle cx="9" cy="7" r="4"/>
   <path d="M19 8v6M22 11h-6"/>
  </svg>
 `;

 const pendingIcon=`
  <svg viewBox="0 0 24 24">
   <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
   <circle cx="9" cy="7" r="4"/>
   <path d="M17 11h6"/>
  </svg>
 `;

 const friendsIcon=`
  <svg viewBox="0 0 24 24">
   <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
   <circle cx="9" cy="7" r="4"/>
   <path d="m17 11 2 2 4-4"/>
  </svg>
 `;

 friendButton.className="add-friend-button";

 if(status==="self"){
  friendButton.style.display="none";
  return;
 }

 friendButton.style.display="flex";

 if(status==="pending"){

  friendButton.classList.add("pending");
  friendButton.innerHTML=pendingIcon+"<span>Permintaan Terkirim</span>";

 }else if(status==="friends"){

  friendButton.classList.add("friends");
  friendButton.innerHTML=friendsIcon+"<span>Sudah Berteman</span>";

 }else if(status==="incoming"){

  friendButton.classList.add("pending");
  friendButton.innerHTML=pendingIcon+"<span>Permintaan Masuk</span>";

 }else{

  friendButton.innerHTML=addIcon+"<span>Tambah Teman</span>";

 }

}

function getFriendStatus(){

 if(CURRENT_USER_ID===TARGET_ID){
  return "self";
 }

 const ownRequest=readStorage(friendKey,null);
 const incomingRequest=readStorage(reverseFriendKey,null);

 if(ownRequest==="friends" || incomingRequest==="friends"){
  return "friends";
 }

 if(ownRequest==="pending"){
  return "pending";
 }

 if(incomingRequest==="pending"){
  return "incoming";
 }

 return "none";

}

function refreshFriendButton(){
 updateFriendButton(getFriendStatus());
}

refreshFriendButton();

friendButton.addEventListener("click",()=>{

 const status=getFriendStatus();

 if(status==="self"){
  return;
 }

 if(status==="friends"){
  showToast("Kamu sudah berteman dengan pengguna ini");
  return;
 }

 if(status==="incoming"){
  showToast("Ada permintaan teman dari pengguna ini");
  return;
 }

 if(status==="pending"){

  localStorage.removeItem(friendKey);

  refreshFriendButton();

  showToast("Permintaan teman dibatalkan");

  return;

 }

 localStorage.setItem(friendKey,JSON.stringify("pending"));

 refreshFriendButton();

 showToast("Permintaan teman berhasil dikirim");

});

/* BACK BUTTON */

document.getElementById("backButton").addEventListener("click",()=>{

 const from=params.get("from");

 if(from){

  try{

   const target=new URL(from,location.origin);

   if(target.origin===location.origin){
    location.replace(target.href);
    return;
   }

  }catch(error){
   console.warn("URL halaman asal tidak valid:",error);
  }

 }

 if(history.length>1){
  history.back();
 }else{
  location.href="profile.html";
 }

});

/* LOAD PROFILE */

async function loadProfile(){

 const user=getTargetUser();

 document.getElementById("profileName").textContent=
  user.name||"Pengguna";

 document.getElementById("userId").textContent=
  "#"+TARGET_ID;

 await loadTargetMedia(user);

 updateMinecraftLevel(user.level);

 const roleKey=updateRole(user.role);

 document.getElementById("verifiedBadge").style.display=
  user.verified && roleKey!=="member"
  ?"inline-flex"
  :"none";

 const comments=getTabData("comments");
 const history=getTabData("history");

 document.getElementById("statMonth").textContent=
  Number(user.months||0).toLocaleString("id-ID");

 document.getElementById("statComments").textContent=
  comments.length.toLocaleString("id-ID");

 document.getElementById("statHistory").textContent=
  history.length.toLocaleString("id-ID");

 document.getElementById("statMinutes").textContent=
  Number(user.totalMinutes||0).toLocaleString("id-ID");

}

/* STORAGE SYNC */

window.addEventListener("storage",event=>{

 if(
  !event.key ||
  event.key==="anilix_users" ||
  event.key==="anilix_user_"+TARGET_ID ||
  event.key==="anilix_comments_"+TARGET_ID ||
  event.key==="anilix_favorites_"+TARGET_ID ||
  event.key==="anilix_history_"+TARGET_ID ||
  event.key===friendKey ||
  event.key===reverseFriendKey
 ){

  loadProfile();
  renderTab();
  refreshFriendButton();

 }

});

/* INIT */

async function initProfile(){

 await loadProfile();
 renderTab();
 refreshFriendButton();

}

initProfile();

</script>
